[project]
name = "expenses"
version = "0.1.0"
description = "Analyse MyExpenses backups with Datasette"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "datasette>=0.65",
    "datasette-dashboards>=0.7",
    "pyyaml>=6",
    "sqlite-utils>=3.37",
]

[project.scripts]
expenses = "expenses.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expenses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
